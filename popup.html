<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Naukri Apply Finder</title>

    <style>
      body {
        width: 300px;
        padding: 16px;
        font-family: Arial, sans-serif;
      }

      h2 {
        margin-top: 0;
        text-align: center;
      }

      .card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 12px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        margin: 6px 0;
      }

      button {
        width: 100%;
        margin-top: 8px;
        padding: 10px;
        cursor: pointer;
        font-size: 14px;
      }

      #status {
        font-weight: bold;
        color: #1565c0;
      }

      #progress {
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <h2>Naukri Apply Finder</h2>

    <div class="card">
      <div class="row">
        <span>Cached Jobs</span>
        <span id="cachedJobs">0</span>
      </div>

      <div class="row">
        <span>Company Apply Jobs</span>
        <span id="companyJobs">0</span>
      </div>

      <div class="row">
        <span>Progress</span>
        <span id="progress">0 / 0</span>
      </div>

      <div class="row">
        <span>Status</span>
        <span id="status">Idle</span>
      </div>

      <div class="row">
        <span>Last Scan</span>
        <span id="lastScan">Never</span>
      </div>
    </div>

    <button id="scanBtn">Scan Current Tab</button>

    <button id="download-btn">Download pending jobs</button>
    <button id="download-all-btn">Download every jobs report</button>

    <button id="clearBtn">Clear Cache</button>

    <script src="popup.js"></script>
  </body>
</html>
